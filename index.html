<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Literary Atlas</title>
  <meta name="description" content="A visual atlas of world literature — explore books across places, eras, concepts and cultural values, and the connections between them." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%23d4a24c' stroke-width='2.5'/%3E%3Cpath d='M2 16h28M16 2c5 4 5 24 0 28M16 2c-5 4-5 24 0 28' fill='none' stroke='%23d4a24c' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <button class="icon-btn only-narrow" id="toggle-sidebar" aria-label="Show filters" title="Filters">☰</button>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">◎</span>
      <div>
        <h1>Literary Atlas</h1>
        <p class="tagline">World literature by place, time, concept &amp; value</p>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" data-view="map" aria-selected="true">Map</button>
      <button role="tab" data-view="network">Constellation</button>
      <button role="tab" data-view="timeline">Timeline</button>
      <button role="tab" data-view="compass">Values Compass</button>
      <button role="tab" data-view="matrix">Concepts × Cultures</button>
    </nav>
    <div class="search">
      <input id="search" type="search" placeholder="Search a title, author, place…" autocomplete="off" aria-label="Search works" />
      <ul id="search-results" class="search-results" role="listbox" hidden></ul>
    </div>
    <button class="icon-btn" id="theme-toggle" aria-label="Toggle light/dark theme" title="Toggle theme">◐</button>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Lenses and filters">
      <section class="panel-section">
        <h2>Journeys</h2>
        <p class="hint">Curated trails through the atlas.</p>
        <div id="journey-list" class="journey-list"></div>
      </section>
      <section class="panel-section">
        <div class="section-head">
          <h2>Concepts</h2>
          <span class="hint">what works explore</span>
        </div>
        <div id="concept-list" class="chip-cloud"></div>
      </section>
      <section class="panel-section">
        <div class="section-head">
          <h2>Values</h2>
          <span class="hint">what cultures prize</span>
        </div>
        <div id="value-list" class="chip-cloud"></div>
      </section>
      <section class="panel-section">
        <div class="section-head">
          <h2>Regions</h2>
          <button class="link-btn" id="regions-all">All</button>
        </div>
        <div id="region-list" class="region-list"></div>
      </section>
      <section class="panel-section">
        <h2>Era</h2>
        <div class="era">
          <label>From <input type="number" id="era-min" step="50" /></label>
          <label>to <input type="number" id="era-max" step="50" /></label>
        </div>
        <div class="era-presets" id="era-presets"></div>
      </section>
      <section class="panel-section">
        <h2>Connections</h2>
        <label class="check"><input type="checkbox" id="show-links" checked /> Show links between works</label>
        <div class="link-legend">
          <span><i class="ln influence"></i>Influence</span>
          <span><i class="ln response"></i>Response / rewriting</span>
          <span><i class="ln kinship"></i>Kinship</span>
          <span><i class="ln shared"></i>Shared concepts</span>
        </div>
      </section>
    </aside>

    <main class="stage" id="stage">
      <div class="stage-head">
        <div id="view-caption" class="view-caption"></div>
        <div id="focus-bar" class="focus-bar" hidden></div>
      </div>
      <div class="canvas" id="canvas"></div>
      <div class="stage-foot">
        <div id="region-legend" class="region-legend" aria-label="Region colours"></div>
        <div id="status" class="status"></div>
      </div>
    </main>

    <aside class="detail" id="detail" aria-live="polite"></aside>
  </div>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
